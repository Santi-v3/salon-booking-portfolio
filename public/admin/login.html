<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Friseur Terminverwaltung</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1e1e2d 0%, #2a2a40 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-container {
      background: #fff;
      border-radius: 16px;
      padding: 40px;
      width: 380px;
      max-width: 90vw;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }
    .login-icon {
      font-size: 48px;
      margin-bottom: 10px;
    }
    .login-header h1 {
      font-size: 24px;
      color: #333;
    }
    .login-header p {
      color: #888;
      font-size: 14px;
      margin-top: 5px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 500;
      font-size: 13px;
      color: #555;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 15px;
      transition: border 0.2s;
      outline: none;
    }
    .form-group input:focus {
      border-color: #5867dd;
    }
    .btn-login {
      width: 100%;
      padding: 14px;
      background: #5867dd;
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-login:hover { background: #4a58d0; }
    .btn-login:disabled { opacity: 0.6; cursor: not-allowed; }
    .error-msg {
      color: #f64e60;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      display: none;
    }
    .error-msg.show { display: block; }
    #toast-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 2000;
    }
    .toast {
      padding: 14px 24px;
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      margin-top: 8px;
      animation: toastIn 0.3s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }
    .toast-error { background: #f64e60; }
    @keyframes toastIn {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-header">
      <div class="login-icon">&#9986;</div>
      <h1>Admin Bereich</h1>
      <p>Friseur Terminverwaltung</p>
    </div>
    <form id="login-form" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>Benutzername</label>
        <input type="text" id="username" placeholder="Benutzername" required autocomplete="username">
      </div>
      <div class="form-group">
        <label>Passwort</label>
        <input type="password" id="password" placeholder="Passwort" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login" id="login-btn">Anmelden</button>
      <div class="error-msg" id="error-msg">Falscher Benutzername oder Passwort</div>
    </form>
  </div>
  <div id="toast-container"></div>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const btn = document.getElementById('login-btn');
      const errorEl = document.getElementById('error-msg');
      btn.disabled = true;
      btn.textContent = 'Wird angemeldet...';
      errorEl.classList.remove('show');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        if (res.ok) {
          window.location.href = '/admin/';
        } else {
          errorEl.classList.add('show');
          btn.disabled = false;
          btn.textContent = 'Anmelden';
        }
      } catch (e) {
        errorEl.textContent = 'Verbindungsfehler zum Server';
        errorEl.classList.add('show');
        btn.disabled = false;
        btn.textContent = 'Anmelden';
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/auth/check');
        const data = await res.json();
        if (data.authenticated) {
          window.location.href = '/admin/';
        }
      } catch (e) {}
    });
  </script>
</body>
</html>
